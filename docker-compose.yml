# Starts MongoDB for local development:   docker compose up -d mongo
# (The Node server runs on your machine so it can use your Docker to launch sandboxes.)
services:
  mongo:
    image: mongo:7
    container_name: codesync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
